<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F3E9" />
    <link rel="icon" type="image/png" href="/images/Logo-optimized.png" />
    <link rel="preload" as="image" type="image/webp" href="/images/hero-1400/Dark-side-warriors-at-the-bazaar.webp" imagesrcset="/images/hero-700/Dark-side-warriors-at-the-bazaar.webp 700w, /images/hero-1400/Dark-side-warriors-at-the-bazaar.webp 1400w" imagesizes="100vw" fetchpriority="high" />
    <link rel="preload" href="/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("10x-shop-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const useDarkTheme = savedTheme === "dark" || (savedTheme !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", useDarkTheme);
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", useDarkTheme ? "#0B0B0B" : "#F7F3E9");
        } catch {
          // The app still loads with the light theme if browser storage is unavailable.
        }
      })();
    </script>
    <style>
      html { background: #f7f3e9; color: #1a1a1a; }
      html.dark { background: #0b0b0b; color: #f3eee3; }
      body { min-width: 320px; min-height: 100vh; margin: 0; background: inherit; }
      #root { min-height: 100vh; }
    </style>
    <title>10X Shop | Treasures of Middle-earth</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
