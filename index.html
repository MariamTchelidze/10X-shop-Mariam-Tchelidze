<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("10x-shop-theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const useDarkTheme = savedTheme === "dark" || (savedTheme !== "light" && prefersDark);
          document.documentElement.classList.toggle("dark", useDarkTheme);
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", useDarkTheme ? "#0b0f19" : "#ffffff");
        } catch {
          // The app still loads with the light theme if browser storage is unavailable.
        }
      })();
    </script>
    <title>10X Shop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
